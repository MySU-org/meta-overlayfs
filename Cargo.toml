[package]
name = "myoverlayfs"
version = "1.3.4"
edition = "2024"
authors = ["KernelSU Developers", "AshBorn", "Kelexine"]
description = "Meta OverlayFS engine with real-time kernel inspection & native WebUI."
license = "GPL-3.0"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
hole-punch = { git = "https://github.com/tiann/hole-punch" }

[target.'cfg(target_os = "android")'.dependencies]
rustix = { git = "https://github.com/MySU-org/rustix", rev = "4a53fbc7cb7a07cabe87125cc21dbc27db316259", features = ["all-apis"] }
procfs = "0.17"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
